name: CI

# Runs only when a PR is opened/updated or something lands on main.
# No schedule: if the code didn't change, the result wouldn't either.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (UTC)
        run: npm test
        env:
          TZ: UTC

      # Week math depends on the local timezone; Sydney has DST on Jan 1,
      # which is the case that broke getISOWeek before.
      - name: Unit tests (Australia/Sydney)
        run: npm test
        env:
          TZ: Australia/Sydney
